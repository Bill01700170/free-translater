<!DOCTYPE html>
<html>
<head>
    <title>AI Translator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>AI Translator</h1>

        <p class="subtitle">Translate naturally with AI.</p>

        <div class="language-row">

            <select id="fromLanguage">
                <option value="English">English</option>
                <option value="Italian">Italian</option>
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
                <option value="German">German</option>
            </select>

            <span>→</span>

            <select id="toLanguage">
                <option value="Italian">Italian</option>
                <option value="English">English</option>
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
                <option value="German">German</option>
            </select>

        </div>

        <textarea id="textInput" placeholder="Type something to translate..."></textarea>

        <button onclick="translateText()">Translate</button>

        <h2>Translation</h2>

        <p id="translation">Your translation will appear here.</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
